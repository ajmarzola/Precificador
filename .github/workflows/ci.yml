name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore Precificador.slnx
      - run: dotnet build Precificador.slnx --configuration Release --no-restore
      - run: dotnet test Precificador.slnx --configuration Release --no-build
